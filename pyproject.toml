[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum-shared"
version = "0.8.8"
description = "Colosseum shared utilities plugin (verify, wait, measure, meta, regex, parsing, prompts)"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "colosseum-core>=0.18,<0.19",
]

[project.entry-points."colosseum.plugins"]
shared = "colosseum_shared:register"

[tool.setuptools.packages.find]
include = ["colosseum_shared*"]

[tool.setuptools.package-data]
colosseum_shared = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["colosseum_shared"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["A", "BLE", "FBT", "N", "COM", "C4", "C901", "ISC", "ICN", "TID", "TCH", "E", "F", "W", "I", "B", "UP", "ANN", "ARG", "SIM", "RET", "PTH", "PLR1702", "PLR0914", "PLR0915", "PLR0912"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG", "C901", "PLR0912", "PLR0914", "PLR0915", "PLR1702"]
"examples/**" = ["ANN", "ARG", "C901", "PLR0912", "PLR0914", "PLR0915", "PLR1702"]
"scripts/**" = ["C901", "PLR0912", "PLR0914", "PLR0915", "PLR1702"]

[tool.mypy]
python_version = "3.12"
packages = ["colosseum_shared"]
exclude = ["tests/", "build/", "examples/"]
mypy_path = [
  ".deps/colosseum-core",
  "../colosseum-core",
]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pytest", "tomli"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "colosseum_shared.measure",
  "colosseum_shared.wait",
  "colosseum_shared.verify.field",
  "colosseum_shared.verify.files",
  "colosseum_shared.verify.meta",
  "colosseum_shared.verify.time",
  "colosseum_shared.regex.api",
  "colosseum_shared.prompt.api",
  "colosseum_shared.meta.api",
  "colosseum_shared.process",
]
disallow_untyped_decorators = false

[tool.bandit]
exclude_dirs = ["tests", "build", "examples", "docs"]
