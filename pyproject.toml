[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum-shared"
version = "0.3.2"
description = "Colosseum shared utilities plugin (verify, regex, parsing, operator prompts)"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "colosseum-core>=0.15,<0.16",
  "pytest>=8.0",
  "bandit[toml]>=1.7",
  "vulture>=2.11",
  "ruff>=0.8",
  "mypy>=1.11",
]

[project.entry-points."colosseum.plugins"]
shared = "colosseum_shared:register"

[tool.setuptools.packages.find]
include = ["colosseum_shared*"]

[tool.setuptools.package-data]
colosseum_shared = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["colosseum_shared"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "ARG", "SIM", "RET", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG"]
"examples/**" = ["ANN", "ARG"]

[tool.mypy]
python_version = "3.12"
packages = ["colosseum_shared"]
exclude = ["tests/", "build/", "examples/"]
mypy_path = [
  ".deps/colosseum-core",
  "../colosseum-core",
]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pytest", "tomli"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "build", "examples", "docs"]
