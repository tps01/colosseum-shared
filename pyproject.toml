[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum-shared"
version = "0.1.0"
description = "Colosseum shared utilities plugin (SSH, regex, parsing)"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "colosseum-core>=0.15,<0.16",
]

[project.optional-dependencies]
ssh = ["paramiko"]
test = ["pytest>=8.0"]
static = [
  "bandit[toml]>=1.7",
  "vulture>=2.11",
  "ruff>=0.8",
  "mypy>=1.11",
  "types-paramiko",
]

[project.entry-points."colosseum.plugins"]
shared = "colosseum_shared:register"

[project.entry-points."colosseum.docgen"]
shared = "colosseum_shared.docgen_entry:spec"

[tool.setuptools.packages.find]
include = ["colosseum_shared*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["colosseum_shared"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "ARG", "SIM", "RET", "PTH"]

[tool.mypy]
python_version = "3.12"
packages = ["colosseum_shared"]
exclude = ["tests/", "build/", "examples/"]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["paramiko.*", "pytest"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "build", "examples", "docs"]
