name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install "colosseum-core>=0.15,<0.16"
          python -m pip install -e ".[ssh,test,static]"
      - name: Test
        run: pytest -q
      - name: Static
        run: |
          ruff check colosseum_shared
          mypy
